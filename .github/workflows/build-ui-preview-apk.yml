name: Quran UI APK
# Login-free preview of the Quran UI (Tilawat + AI recitation pages) for
# checking the Mushaf rendering before the backend is hosted. Separate
# application id, so it installs next to the real app.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-ui-preview-apk.yml"
      - "mobile/lib/main_ui_preview.dart"
      - "mobile/test/ui_preview_test.dart"
      - "mobile/android/app/build.gradle.kts"
      - "mobile/android/app/src/main/**"
      - "scripts/ci_android_signing.sh"
      - "scripts/ci_verify_apk.sh"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quran-ui-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare separate preview app
        run: |
          python3 - <<'PY'
          import pathlib, re, json, os
          # App id and label come from the qariUiPreview Gradle property
          # (see the build step), not from editing build files here.
          spec = pathlib.Path("mobile/pubspec.yaml").read_text()
          match = re.search(r"^version:\s*([\d.]+)\+(\d+)", spec, re.M)
          release = json.loads(pathlib.Path("releases/app_release.json").read_text())
          code = max(int(match.group(2)), int(release["version_code"])) + int(os.environ["GITHUB_RUN_NUMBER"])
          with pathlib.Path("build-preview.env").open("w") as output:
              output.write(f"PREVIEW_VERSION={match.group(1)}\nPREVIEW_CODE={code}\n")
          PY
          cat build-preview.env >> "$GITHUB_ENV"
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Format preview sources
        working-directory: mobile
        run: dart format lib/main_ui_preview.dart test/ui_preview_test.dart
      - name: Verify offline entry and Quran modes
        working-directory: mobile
        run: flutter test test/ui_preview_test.dart test/full_page_recitation_test.dart test/mushaf_modes_test.dart test/library_offline_test.dart
      - name: Set up release signing
        env:
          SAFHA_KEYSTORE_BASE64: ${{ secrets.SAFHA_KEYSTORE_BASE64 }}
          SAFHA_KEYSTORE_PASSWORD: ${{ secrets.SAFHA_KEYSTORE_PASSWORD }}
          SAFHA_KEY_ALIAS: ${{ secrets.SAFHA_KEY_ALIAS }}
          SAFHA_KEY_PASSWORD: ${{ secrets.SAFHA_KEY_PASSWORD }}
        run: ./scripts/ci_android_signing.sh
      # Every ABI: 32-bit ARM phones (many budget / Android Go models) could
      # not install the old arm64-only preview.
      - name: Build preview APK
        working-directory: mobile
        env:
          ORG_GRADLE_PROJECT_qariUiPreview: "true"
        run: flutter build apk --release --target lib/main_ui_preview.dart --target-platform android-arm,android-arm64,android-x64 --build-name "$PREVIEW_VERSION" --build-number "$PREVIEW_CODE"
      - name: Verify Android package and signature
        run: |
          mkdir -p build-preview
          PREVIEW_APK="build-preview/Qari-Quran-UI-Preview-v${PREVIEW_CODE}.apk"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "$PREVIEW_APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$PREVIEW_APK" | tee build-preview/package.txt
          grep -q "package: name='com.aiquranic.safha.uipreview'" build-preview/package.txt
          if [ -f mobile/android/key.properties ]; then
            ./scripts/ci_verify_apk.sh "$PREVIEW_APK" --release-key
          else
            ./scripts/ci_verify_apk.sh "$PREVIEW_APK"
          fi
          sha256sum "$PREVIEW_APK" | tee build-preview/SHA256SUMS.txt
          stat -c "APK size: %s bytes" "$PREVIEW_APK"
      - uses: actions/upload-artifact@v4
        with:
          name: qari-quran-ui-preview-v${{ env.PREVIEW_CODE }}
          path: build-preview/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

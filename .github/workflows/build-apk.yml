# Builds the release APK in GitHub Actions instead of on the VPS.
#
# Trigger it manually from the Actions tab (workflow_dispatch). It reuses
# scripts/release_app.sh, so the version bump + releases/app_release.json
# update behave exactly like a VPS build. The built APK is:
#   1. uploaded as a workflow artifact (always), and
#   2. committed back to the branch as releases/app-release.apk together with
#      the bumped pubspec.yaml + app_release.json (when commit_release=true),
#      so the VPS only needs `git pull` to serve the new OTA build from
#      /v1/app/download — no Flutter/Android SDK needed on the VPS anymore.
#
# Live recitation streams to our own VPS backend (/ws/recitation/stream).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump version_code before building"
        type: boolean
        default: true
      commit_release:
        description: "Commit APK + metadata back to this branch (VPS then just git-pulls)"
        type: boolean
        default: true
      mic_pilot:
        description: "Build a separate Qari Mic Test package for capture qualification"
        type: boolean
        default: false
      notes_en:
        description: "Release notes (English) for app_release.json"
        type: string
        default: ""

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

# The commit-back step pushes the built APK + bumped metadata; the repo's
# default GITHUB_TOKEN is read-only, so grant contents write explicitly.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Latest stable: the dependency set needs a modern Dart (retrofit 4.9.x
      # requires Dart >=3.8, i.e. Flutter 3.32+), so an old pin fails pub get.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK (release_app.sh)
        env:
          BUMP: ${{ inputs.bump }}
          NOTES_EN: ${{ inputs.notes_en }}
          MIC_PILOT: ${{ inputs.mic_pilot }}
        run: |
          ARGS=()
          if [ "$BUMP" = "true" ]; then ARGS+=(--bump); fi
          if [ "$MIC_PILOT" = "true" ]; then ARGS+=(--mic-pilot); fi
          if [ -n "$NOTES_EN" ]; then ARGS+=(--notes-en "$NOTES_EN"); fi
          ./scripts/release_app.sh "${ARGS[@]}"

      - name: Verify native microphone PCM conversion
        working-directory: mobile/android
        env:
          ORG_GRADLE_PROJECT_qariMicPilot: ${{ inputs.mic_pilot }}
        run: ./gradlew :app:testReleaseUnitTest -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false --no-daemon

      - name: Verify APK package identity
        env:
          MIC_PILOT: ${{ inputs.mic_pilot }}
        run: |
          if command -v rg >/dev/null; then
            AAPT=$(rg --files "$ANDROID_HOME/build-tools" | rg '/aapt$' | sort -V | tail -1)
          else
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          fi
          APK=releases/app-release.apk
          if [ "$MIC_PILOT" = "true" ]; then APK=releases/app-mic-pilot.apk; fi
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/qari-apk-badging.txt"
          PACKAGE=$(sed -n '1p' "$RUNNER_TEMP/qari-apk-badging.txt")
          EXPECTED=com.qari.app
          if [ "$MIC_PILOT" = "true" ]; then EXPECTED=com.qari.app.micpilot; fi
          echo "$PACKAGE"
          echo "$PACKAGE" | grep -F "name='$EXPECTED'"

      - name: Read built version
        id: version
        env:
          MIC_PILOT: ${{ inputs.mic_pilot }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "releases/app_mic_pilot.json" if os.environ["MIC_PILOT"] == "true" else "releases/app_release.json"
          data = json.load(open(path))
          version = str(data["version"]) + "+" + str(data["version_code"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("version=" + version + "\n")
          print("Built version:", version)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.mic_pilot && 'qari-mic-pilot' || 'qari-app-release' }}-${{ steps.version.outputs.version }}
          path: ${{ inputs.mic_pilot && 'releases/app-mic-pilot.apk' || 'releases/app-release.apk' }}
          if-no-files-found: error

      - name: Commit APK + metadata back to branch
        if: ${{ inputs.commit_release && !inputs.mic_pilot }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # releases/ is git-ignored (a97663d); force-add the published files.
          git add -f releases/app-release.apk releases/app_release.json mobile/pubspec.yaml
          if git diff --cached --quiet; then
            echo "Nothing to commit (APK unchanged)."
            exit 0
          fi
          git commit -m "build(release): v${{ steps.version.outputs.version }} via GitHub Actions"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

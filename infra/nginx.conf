# Use Docker's embedded DNS so upstreams are re-resolved after a container
# is recreated (otherwise nginx keeps the stale container IP and returns 502).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream core_api {
    zone core_api 64k;
    server core-api:8000 resolve;
}

upstream recitation_api {
    zone recitation_api 64k;
    server recitation-api:8001 resolve;
}

server {
    listen 80;
    server_name api.qari.app;

    # Core API
    location /v1/ {
        proxy_pass http://core_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recitation API
    location /v1/recitations/ {
        proxy_pass http://recitation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://recitation_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Health checks
    location /health {
        proxy_pass http://core_api;
    }
}

# HTTPS (self-signed cert in /etc/nginx/certs). The Flutter app trusts the
# embedded CA, so OTA APK downloads work over TLS.
server {
    listen 443 ssl;
    server_name api.qari.app 20.197.40.13;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Core API
    location /v1/ {
        proxy_pass http://core_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recitation API (separate service: upload + result polling).
    # This MUST exist on :443 too — without it, POST /v1/recitations/upload
    # falls through to core_api (which only has GET /{session_id}) and
    # returns HTTP 405 Method Not Allowed.
    location /v1/recitations/ {
        proxy_pass http://recitation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://recitation_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://core_api;
    }
}

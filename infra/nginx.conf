# Use Docker's embedded DNS so upstreams are re-resolved after a container
# is recreated (otherwise nginx keeps the stale container IP and returns 502).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream core_api {
    zone core_api 64k;
    server core-api:8000 resolve;
}

upstream recitation_api {
    zone recitation_api 64k;
    server recitation-api:8001 resolve;
}

server {
    listen 80;
    server_name api.qari.app;

    # Core API
    location /v1/ {
        proxy_pass http://core_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 32 256k;
        proxy_temp_file_write_size 256k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Recitation API
    location /v1/recitations/ {
        proxy_pass http://recitation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    #
    # Long read/send timeouts so a continuous hands-free recitation session
    # (Memorization Mode — user recites for many minutes while walking/driving)
    # is NOT dropped by the proxy. Default nginx proxy_read_timeout is only 60s,
    # which would kill the live audio stream during a natural pause. We keep the
    # socket open for up to 1h; the app also sends periodic ping frames.
    location /ws/ {
        proxy_pass http://recitation_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Health checks
    location /health {
        proxy_pass http://core_api;
    }
}

# HTTPS (self-signed cert in /etc/nginx/certs). The Flutter app trusts the
# embedded CA, so OTA APK downloads work over TLS.
server {
    listen 443 ssl;
    server_name api.qari.app 137.23.42.171;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Core API
    location /v1/ {
        proxy_pass http://core_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 32 256k;
        proxy_temp_file_write_size 256k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Recitation API (separate service: upload + result polling).
    # This MUST exist on :443 too — without it, POST /v1/recitations/upload
    # falls through to core_api (which only has GET /{session_id}) and
    # returns HTTP 405 Method Not Allowed.
    location /v1/recitations/ {
        proxy_pass http://recitation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    #
    # Long read/send timeouts so a continuous hands-free recitation session
    # (Memorization Mode — user recites for many minutes while walking/driving)
    # is NOT dropped by the proxy. Default nginx proxy_read_timeout is only 60s,
    # which would kill the live audio stream during a natural pause. We keep the
    # socket open for up to 1h; the app also sends periodic ping frames.
    location /ws/ {
        proxy_pass http://recitation_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://core_api;
    }
}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qari
      POSTGRES_PASSWORD: qari
      POSTGRES_DB: qari
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qari"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ../backend/core_api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      QARI_DATABASE_URL: postgresql+asyncpg://qari:qari@postgres:5432/qari
      QARI_REDIS_URL: redis://redis:6379/0
      QARI_ENVIRONMENT: dev
      QARI_CORS_ORIGINS: http://20.244.30.169
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/core_api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  recitation-api:
    build:
      context: ../backend/recitation_api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      QARI_REDIS_URL: redis://redis:6379/1
      QARI_CORE_API_BASE_URL: http://core-api:8000
      QARI_ENVIRONMENT: dev
      QARI_CORS_ORIGINS: http://20.244.30.169
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../backend/recitation_api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  inference-worker:
    build:
      context: ../backend/recitation_api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      QARI_REDIS_URL: redis://redis:6379/1
      QARI_ENVIRONMENT: dev
      QARI_ML_USE_STUB: "true"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../backend/recitation_api:/app
    command: python -m app.workers.inference_worker

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: qari
      MINIO_ROOT_PASSWORD: qari12345
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
